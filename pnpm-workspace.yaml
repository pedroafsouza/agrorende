packages:
  - apps/*
  - packages/*

# One version for libraries used by several packages.
catalog:
  typescript: ^5.9.0
  zod: ^4.1.0
  react: 19.x
  react-dom: 19.x
  vitest: ^3.2.0
  "@types/node": ^24.0.0
  "@types/react": ^19.0.0
  mongodb: ^7.7.0
  bson: ^7.3.0
  ioredis: ^6.0.0
  jose: ^6.2.0
  pino: ^10.3.0
  "socket.io-client": ^4.8.0
  "date-fns": ^4.1.0
  "date-fns-tz": ^3.2.0
  tsup: ^8.5.0
  tsx: ^4.23.0
  eslint: ^10.11.0
  prettier: ^3.9.0
  "react-hook-form": ^7.65.0
  "@hookform/resolvers": ^5.2.0
  uuidv7: ^1.0.2

# pnpm 11: only these packages may run install scripts. Keep the list minimal.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  "@node-rs/argon2": true
  "@parcel/watcher": true
  "@swc/core": true
  msgpackr-extract: true
  "@sentry/cli": false

minimumReleaseAge: 1440
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
resolutionMode: highest

# One Playwright in the tree: `@playwright/cli` (agent toolkit) pins an alpha build, which would
# otherwise shadow the `playwright` binary that runs the web E2E suite (change request T11-001).
overrides:
  "@playwright/cli>@playwright/test": "1.64.0"
  "@playwright/cli>playwright": "1.64.0"
  "@playwright/cli>playwright-core": "1.64.0"
  # GHSA-w5hq-g745-h8pq (uuid <11.1.1): `xcode` (Expo config plugins) pins uuid ^7 and only calls
  # `require("uuid").v4()`, which uuid 11 still exports from its CommonJS build.
  "xcode>uuid": "^11.1.1"

# Advisories whose patched versions are not published on npmjs.org yet, so no override can reach
# them. All three reach the tree only through Expo tooling in apps/mobile (development and build
# time, never shipped in the app bundle or run by the web, realtime or worker services). Remove
# each entry as soon as the patched version is published and add an override above instead.
auditConfig:
  ignoreGhsas:
    # node-forge <=1.4.0, patched >=1.4.1 (latest published: 1.4.0). Used by @expo/cli and
    # @expo/code-signing-certificates for local dev-server HTTPS and update code signing.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3, patched >=3.0.4 (latest published: 3.0.3). Used by micromatch inside the
    # Metro bundler file map; patterns come from the repository's own configuration.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js <=1.1.3, patched >=1.1.4 (latest published: 1.1.3). Used by argparse 1 through
    # js-yaml 3 in the Jest/Babel tooling pulled in by Expo; format strings are not user input.
    - GHSA-hp3w-g68c-fv3c
