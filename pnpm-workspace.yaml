packages:
  - apps/*
  - packages/*

# One version for libraries used by several packages.
catalog:
  typescript: ^5.9.0
  zod: ^4.1.0
  react: 19.x
  react-dom: 19.x
  vitest: ^3.2.0
  "@types/node": ^24.0.0
  "@types/react": ^19.0.0
  mongodb: ^7.7.0
  bson: ^7.3.0
  ioredis: ^6.0.0
  jose: ^6.2.0
  pino: ^10.3.0
  "socket.io-client": ^4.8.0
  "date-fns": ^4.1.0
  "date-fns-tz": ^3.2.0
  tsup: ^8.5.0
  tsx: ^4.23.0
  eslint: ^10.11.0
  prettier: ^3.9.0
  "react-hook-form": ^7.65.0
  "@hookform/resolvers": ^5.2.0
  uuidv7: ^1.0.2

# pnpm 11: only these packages may run install scripts. Keep the list minimal.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  "@node-rs/argon2": true
  "@parcel/watcher": true
  "@swc/core": true
  msgpackr-extract: true
  "@sentry/cli": false

minimumReleaseAge: 1440
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
resolutionMode: highest

# One Playwright in the tree: `@playwright/cli` (agent toolkit) pins an alpha build, which would
# otherwise shadow the `playwright` binary that runs the web E2E suite (change request T11-001).
overrides:
  "@playwright/cli>@playwright/test": "1.64.0"
  "@playwright/cli>playwright": "1.64.0"
  "@playwright/cli>playwright-core": "1.64.0"
