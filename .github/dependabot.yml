version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - '@types/react'
      mongodb:
        patterns:
          - mongodb
          - bson
      testing:
        patterns:
          - vitest
          - '@playwright/*'
          - playwright
      lint-types:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - eslint-plugin-*
          - typescript
          - '@types/*'
          - prettier
      auth-oidc:
        patterns:
          - arctic
          - jose
    # Major versions change APIs (TypeScript 7, vitest 5, @tanstack/react-table 9, ...) and are
    # migrated by hand in a dedicated task, not by an automatic pull request.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: expo
      - dependency-name: expo*
      - dependency-name: '@expo/*'
      - dependency-name: react-native
      - dependency-name: react-native-*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/realtime
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
