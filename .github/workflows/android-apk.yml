# Unsigned Android APK for every release (docs/RELEASING.md §6.1).
#
# - Tag vX.Y.Z: build the production variant on the runner (expo prebuild + Gradle, no EAS and no
#   Expo account), then attach `agrorende-vX.Y.Z-unsigned.apk` and its `.sha256` to the GitHub
#   Release that `release.yml` (job `promote`) creates for the same tag.
# - Manual run: build any ref or tag with the chosen variant. When `tag` names an existing release,
#   the files are attached to it too (`--clobber` replaces earlier uploads).
# The APK is deliberately unsigned: Android refuses to install it until someone signs it with
# their own key (`zipalign` + `apksigner`, see docs/RELEASING.md). Store builds stay on EAS
# (`mobile.yml`).
#
# Releases created by `release.yml` with GITHUB_TOKEN never trigger `release:` events, so this
# workflow listens to the tag push and waits for the release to appear instead; that also keeps a
# single upload per tag.
name: android-apk

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (vX.Y.Z). Empty builds the selected ref as a workflow artifact only.
        type: string
        required: false
        default: ""
      variant:
        description: App variant (APP_VARIANT)
        type: choice
        options:
          - production
          - preview
        required: true
        default: production

permissions:
  contents: read

concurrency:
  group: android-apk-${{ inputs.tag || github.ref_name }}-${{ inputs.variant || 'production' }}
  cancel-in-progress: false

jobs:
  apk:
    name: unsigned apk (${{ inputs.variant || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      APP_VARIANT: ${{ inputs.variant || 'production' }}
      # Only the ABIs real phones use; x86 emulator ABIs would double the native build time.
      ANDROID_ARCHS: ${{ vars.ANDROID_APK_ARCHS || 'armeabi-v7a,arm64-v8a' }}
      EAS_UPDATE_URL: ${{ vars.EAS_UPDATE_URL }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_APP_ENV: ${{ (inputs.variant || 'production') == 'production' && 'production' || 'staging' }}
      EXPO_PUBLIC_API_URL: https://${{ vars.APP_HOST || ((inputs.variant || 'production') == 'production' && 'app.agrorende.com.br' || 'app.staging.agrorende.com.br') }}
      EXPO_PUBLIC_WS_URL: https://${{ vars.WS_HOST || ((inputs.variant || 'production') == 'production' && 'ws.agrorende.com.br' || 'ws.staging.agrorende.com.br') }}
      EXPO_PUBLIC_SITE_URL: https://${{ vars.SITE_HOST || ((inputs.variant || 'production') == 'production' && 'agrorende.com.br' || 'staging.agrorende.com.br') }}
      EXPO_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.PLATFORM_SUPPORT_WHATSAPP }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      # No Sentry auth token on this runner: skip the source map upload of the Sentry Gradle plugin.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      CI: "1"
    steps:
      - name: Check the tag
        run: |
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z (got $TAG)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the Android SDK
        run: |
          if [[ -z "${ANDROID_HOME:-}" || ! -d "$ANDROID_HOME" ]]; then
            echo "::error::ANDROID_HOME is not set; the ubuntu-latest image should provide the Android SDK."
            exit 1
          fi
          echo "Android SDK: $ANDROID_HOME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "mobile..."

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Remove the debug signing from the release build
        working-directory: apps/mobile/android/app
        run: |
          in_release() { awk '/^[[:space:]]*release[[:space:]]*\{/{r=1} r&&/signingConfig[[:space:]]+signingConfigs\.debug/{c++} r&&/^[[:space:]]*\}/{r=0} END{print c+0}' build.gradle; }
          if [[ "$(in_release)" != "1" ]]; then
            echo "::error::Expected one 'signingConfig signingConfigs.debug' line in the release buildType of build.gradle; the Expo template changed."
            exit 1
          fi
          perl -i -ne 'print unless (/^\s*release\s*\{/ .. /^\s*\}/) && /^\s*signingConfig\s+signingConfigs\.debug\s*$/' build.gradle
          if [[ "$(in_release)" != "0" ]]; then
            echo "::error::The release buildType still signs with the debug key."
            exit 1
          fi
          sed -n '/buildTypes {/,/^    }/p' build.gradle

      - name: Build the release APK
        working-directory: apps/mobile/android
        # lintVitalRelease is skipped: apps/mobile/locales/*.json nest their strings under "expo",
        # which prebuild turns into an Android string resource "expo" with no default value, and
        # the ExtraTranslation check fails the release build (docs/progress/APK-RELEASE.md).
        run: ./gradlew assembleRelease -x lintVitalRelease --no-daemon -PreactNativeArchitectures="$ANDROID_ARCHS"

      - name: Check, rename and hash the APK
        id: apk
        run: |
          apk="$(find apps/mobile/android/app/build/outputs/apk/release -name 'app-release-unsigned.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::app-release-unsigned.apk was not produced."
            find apps/mobile/android/app/build/outputs -name '*.apk' -print
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [[ -n "$apksigner" ]] && "$apksigner" verify "$apk" > /dev/null 2>&1; then
            echo "::error::The APK is signed; expected an unsigned build."
            exit 1
          fi
          label="${TAG:-$(git rev-parse --short=12 HEAD)}"
          suffix=""
          if [[ "$APP_VARIANT" != "production" ]]; then suffix="-$APP_VARIANT"; fi
          name="agrorende-${label}${suffix}-unsigned.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Unsigned Android APK"
            echo "- file: \`$name\` ($(du -h "dist/$name" | cut -f1))"
            echo "- sha256: \`$(cut -d' ' -f1 "dist/$name.sha256")\`"
            echo "- variant: \`$APP_VARIANT\`, ABIs: \`$ANDROID_ARCHS\`, API: \`$EXPO_PUBLIC_API_URL\`"
            echo "- sign it before installing (docs/RELEASING.md §6.1)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the GitHub Release
        if: ${{ env.TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          # release.yml creates the release after its staging checks; wait up to 30 minutes for it.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$TAG" "dist/$NAME" "dist/$NAME.sha256" --clobber --repo "$GITHUB_REPOSITORY"
              echo "- attached to release \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::No GitHub Release $TAG after 30 minutes. Fix release.yml, then rerun this workflow with tag=$TAG."
          exit 1
