name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: ci
  MONGODB_URI: mongodb://localhost:27017/?directConnection=true
  MONGODB_DB: agrorende_ci
  REDIS_URL: redis://localhost:6379
  MEDIA_DRIVER: local
  MEDIA_ROOT: ./.data/media-ci
  REALTIME_PORT: '4001'
  WORKER_HEALTH_PORT: '4002'

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local services
        run: docker compose up -d --wait mongo redis

      - name: Run workspace checks
        run: pnpm check

      - name: Run i18n checks
        run: pnpm i18n:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/junit.xml
            **/junit-*.xml
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/**
            **/coverage/**
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build

      - name: Build public site
        run: pnpm --filter site build

      - name: Export mobile Android bundle
        run: pnpm --filter mobile exec expo export --platform android

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.ENABLE_E2E == 'true' }}
    needs: build
    steps:
      - name: E2E disabled until T11
        run: echo "E2E is enabled by T11."
