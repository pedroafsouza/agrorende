name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: ci
  MONGODB_URI: mongodb://localhost:27017/?directConnection=true
  MONGODB_DB: agrorende_ci
  REDIS_URL: redis://localhost:6379
  MEDIA_DRIVER: local
  MEDIA_ROOT: ./.data/media-ci
  REALTIME_PORT: '4001'
  WORKER_HEALTH_PORT: '4002'

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm-lock.yaml is committed; a dependency change must update it with `pnpm install`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local services
        run: |
          docker compose up -d --wait mongo redis oidc-mock
          # The OAuth and golden-path tests sign in through the mock OIDC provider on :4003.
          for _ in $(seq 1 30); do curl -fsS http://localhost:4003/google/.well-known/openid-configuration > /dev/null && break; sleep 2; done

      - name: Run workspace checks
        run: pnpm check

      - name: Run i18n checks
        run: pnpm i18n:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/junit.xml
            **/junit-*.xml
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/**
            **/coverage/**
          if-no-files-found: ignore

  chaos:
    name: chaos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local services
        run: docker compose up -d --wait mongo redis

      # ARCHITECTURE §15: the offline chaos suite runs three times in a row (change request T12-001).
      - name: Run offline chaos suite three times
        env:
          MONGODB_DB: agrorende_t12
          MEDIA_ROOT: ./.data/media-t12
        run: |
          for run in 1 2 3; do
            echo "Chaos run ${run} of 3"
            pnpm --filter mobile test:chaos
          done

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm-lock.yaml is committed; a dependency change must update it with `pnpm install`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build

      # The canonical and hreflang URLs are baked in at build time, so the CI build points them
      # at the local server the site checks below use (port 3191, see apps/landing/playwright.config.ts).
      - name: Build public site
        env:
          SITE_URL: http://localhost:3191
        run: pnpm --filter landing build

      - name: Install Chromium for the site checks
        run: pnpm --filter landing exec playwright install --with-deps chromium

      # Smoke on every page in both locales, axe, link checker, same-origin and no-cookie checks.
      - name: Public site end-to-end checks
        run: pnpm --filter landing e2e

      - name: Public site Lighthouse budgets
        run: pnpm --filter landing lhci

      - name: Upload public site check results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: site-checks
          path: |
            .data/e2e-results-site
            .data/lhci-site
            .data/junit-e2e-site.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Export mobile Android bundle
        run: pnpm --filter mobile exec expo export --platform android

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # @playwright/test and @axe-core/playwright are web devDependencies (change request T11-001).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Playwright starts its own isolated stack (web :3100, realtime :4101, mock OIDC :4103,
      # database agrorende_e2e, media .data/media-e2e); only MongoDB and Redis come from compose.
      - name: Start local services
        run: docker compose up -d --wait mongo redis

      - name: Run Playwright
        env:
          MONGODB_DB: agrorende_e2e
          MEDIA_ROOT: ./.data/media-e2e
        # Load the public local values (JWT_SECRET, AUTH_ENCRYPTION_KEY, ...) from .env.example;
        # E2E_ENV in apps/web/e2e/support/env.ts still overrides ports, database and media.
        run: |
          set -a
          . ./.env.example
          set +a
          export MONGODB_DB=agrorende_e2e MEDIA_ROOT=./.data/media-e2e
          pnpm --filter web exec playwright test

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            .data/e2e-results/**
            .data/reviews/T11/**
            apps/web/junit-e2e.xml
          if-no-files-found: ignore
