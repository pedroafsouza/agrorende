services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      # Healthy only once this node is PRIMARY; initiating the replica set alone is not enough.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  redis:
    image: redis:7
    ports: ["6379:6379"]
  oidc-mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports: ["4003:8080"]
    environment:
      JSON_CONFIG: '{"interactiveLogin":true,"httpServer":"NettyWrapper","tokenCallbacks":[{"issuerId":"google","tokenExpiry":3600,"requestMappings":[]},{"issuerId":"apple","tokenExpiry":3600,"requestMappings":[]}]}'
volumes: { mongodata: {} }
